<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fieldproof - grounded document review</title>
    <meta
      name="description"
      content="Review UI for fieldproof: every extracted field linked to the exact words it came from."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2314524c'/%3E%3Cpath d='M7 12.5l3 3 7-7.5' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,560&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so there's no flash of the wrong theme; the
      // toggle in the toolbar just flips this same attribute + key.
      (function () {
        try {
          var saved = localStorage.getItem("fieldproof-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* storage unavailable - system preference still applies via CSS */
        }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Officina, open-source tools by Anton Soloviev" />
    <meta property="og:title" content="fieldproof - grounded document review" />
    <meta property="og:description" content="Document extraction that shows its work: every LLM-extracted field grounded to its source words, verified, and reviewable." />

    <meta name="twitter:image" content="https://raw.githubusercontent.com/antonsoo/fieldproof/main/docs/assets/og.png" />

  </body>
</html>
