name: Pages

# Builds the static demo and publishes it to the gh-pages branch; GitHub
# Pages serves that branch directly (Settings -> Pages -> "Deploy from a
# branch": gh-pages, /). A plain Node build - the data
# scripts/build_demo_data.py precomputes (web/public/demo-data/) is
# committed to the repo rather than regenerated here, so this workflow
# never needs Python/uv - see CONTRIBUTING.md for regenerating it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build:demo

      - name: Publish to gh-pages
        env:
          SITE_DIR: web/dist-demo
        run: |
          cd "$SITE_DIR"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
