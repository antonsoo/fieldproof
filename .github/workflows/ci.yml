name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra ocr

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Typecheck (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest -q

  minimums:
    name: Oldest supported Python and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true

      # `requires-python` and every ">=" in pyproject.toml are promises. The lockfile tests
      # the newest versions; this installs the oldest ones the package says it accepts.
      - name: Install the oldest allowed version of each direct dependency
        run: |
          uv venv .venv-minimums
          uv pip install --python .venv-minimums --resolution lowest-direct -e ".[dev,ocr]"

      - name: Test (pytest)
        run: .venv-minimums/bin/pytest -q

  web:
    name: Web UI (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
