[project]
name = "fieldproof"
version = "0.1.0"
description = "Document extraction that shows its work: every field linked to the exact words it came from."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anton Soloviev" }]
keywords = [
    "document-ai",
    "llm",
    "extraction",
    "grounding",
    "invoice-processing",
    "ocr",
    "pdf",
    "structured-output",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.4"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
]

[project.urls]
Homepage = "https://antonsoo.github.io/fieldproof/"
Repository = "https://github.com/antonsoo/fieldproof"
Issues = "https://github.com/antonsoo/fieldproof/issues"

[project.scripts]
fieldproof = "fieldproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldproof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's `param: T = typer.Option(...)` is the documented API; B008 (no
# function calls in defaults) is a false positive for it.
"src/fieldproof/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["scripts/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
