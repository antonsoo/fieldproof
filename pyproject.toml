[project]
name = "fieldproof"
version = "0.2.5"
description = "Document extraction that shows its work: every field linked to the exact words it came from."
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anton Soloviev", email = "anton@praviel.com" }]
keywords = [
    "document-ai",
    "llm",
    "extraction",
    "grounding",
    "invoice-processing",
    "ocr",
    "pdf",
    "structured-output",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.10",
    "pdfplumber>=0.11.9",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.9",
    "fastapi>=0.133",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "typer>=0.16",
    "anthropic>=0.77",
    # Not imported here: they parse what a stranger uploads (PDFs, multipart forms, HTTP) or
    # the command line, and older releases have published advisories. These are the first
    # without one (2026-10-02); the floors of pdfplumber, fastapi and typer above are the
    # oldest that install beside them.
    "pdfminer.six>=20251230",
    "starlette>=1.3.1",
    "click>=8.3.3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=12.3"]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
]

[project.urls]
Homepage = "https://antonsoo.github.io/fieldproof/"
Repository = "https://github.com/antonsoo/fieldproof"
Issues = "https://github.com/antonsoo/fieldproof/issues"

[project.scripts]
fieldproof = "fieldproof.cli:app"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI doesn't resolve relative links, so the README's images and links are
# rewritten to absolute GitHub URLs when the package is built: images first,
# then every link that is still relative.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/antonsoo/fieldproof/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/antonsoo/fieldproof/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/antonsoo/fieldproof/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/antonsoo/fieldproof/blob/main/\1"'

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE*", "/pyproject.toml"]

[tool.hatch.build]
# The review UI is built into this directory by scripts/bundle_ui.py. It is build
# output, so git ignores it; listing it here puts it in the wheel and the sdist.
artifacts = ["src/fieldproof/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldproof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's `param: T = typer.Option(...)` is the documented API; B008 (no
# function calls in defaults) is a false positive for it.
"src/fieldproof/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["scripts/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
